# CI. The gates themselves live in scripts/ci.sh so they are portable: this file
# only installs toolchains and calls that script. Moving to GitLab or to an
# on-premise runner means rewriting this file, never the gates.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.1"
          enable-cache: true
      - name: Install dependencies (locked)
        run: uv sync --frozen
        working-directory: backend
      - run: scripts/ci.sh backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (locked)
        run: npm ci
        working-directory: frontend
      - run: scripts/ci.sh frontend

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # Gitleaks scans history, not just the tip
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.1"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Build the bundle (the no-CDN gate inspects the output)
        run: npm run build
        working-directory: frontend
      - name: Free licences only
        run: uv run --project backend python scripts/license_gate.py
      - name: No CDN in the built bundle
        run: uv run --project backend python scripts/no_cdn_check.py --dist frontend/dist
      # The Gitleaks BINARY (MIT), not gitleaks/gitleaks-action: the action
      # ships under a proprietary EULA that requires a paid key for
      # organisation repositories (CLAUDE.md → Hard Rules, free licences only).
      # Same version and pinned digest as docker/analysis.Dockerfile
      # (backend/tests/test_tool_pins.py keeps the two equal): a checksum file
      # from the same release catches corruption, not a replaced release.
      - name: Install Gitleaks (MIT, pinned, digest verified)
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 gitleaks "$RUNNER_TEMP/bin/gitleaks"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version
      # Two passes, as in scripts/ci.sh: the working tree and the full history
      # (checkout above uses fetch-depth: 0).
      - name: No secrets in the repository
        run: |
          gitleaks dir . --config .gitleaks.toml --redact --no-banner
          gitleaks git . --config .gitleaks.toml --redact --no-banner

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dioptra
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: dioptra
        options: >-
          --health-cmd "pg_isready -U dioptra" --health-interval 5s
          --health-timeout 3s --health-retries 20
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.1"
      - run: uv sync --frozen
        working-directory: backend
      - name: Upgrade and downgrade against a real PostgreSQL
        # A migration that cannot be rolled back is not a migration.
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
        working-directory: backend
        env:
          DIOPTRA_ENV: test
          DIOPTRA_JWT_SECRET: ci-only-secret-value-at-least-32-chars
          DIOPTRA_DATABASE_URL: postgresql+psycopg://dioptra:ci-only-password@localhost:5432/dioptra

      - name: The migration and the ORM metadata agree
        # Local tests build the schema from Base.metadata; CI applies the
        # migration. Nothing compared the two, so they could drift silently.
        run: uv run alembic check
        working-directory: backend
        env:
          DIOPTRA_ENV: test
          DIOPTRA_JWT_SECRET: ci-only-secret-value-at-least-32-chars
          DIOPTRA_DATABASE_URL: postgresql+psycopg://dioptra:ci-only-password@localhost:5432/dioptra

      - name: A data-converting migration meets real rows, not an empty table
        # `alembic upgrade head` on an EMPTY database never runs a USING clause,
        # so a data conversion can be broken and CI stays green. Proven by the
        # precommit panel on 2026-09-23: 0011 guarded on the SHAPE of an ISO
        # date and not its VALIDITY, so a hand-typed `2024-02-30` passed the
        # regex, raised in the cast and aborted the whole ALTER TABLE — every
        # deployment holding such a row could not upgrade. Seed the values a
        # free-text column really held, then migrate across it.
        run: |
          set -euo pipefail
          uv run alembic downgrade 0010_equivalent_mutants
          psql "$PGURL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO projects (id, name, created_at, updated_at)
              SELECT gen_random_uuid(), 'ci-' || i, now(), now() FROM generate_series(1, 7) i;
            INSERT INTO systems (id, project_id, name, installed_at, created_at, updated_at)
              SELECT gen_random_uuid(), p.id, p.name, v.val, now(), now()
              FROM (SELECT id, name, row_number() OVER (ORDER BY name) rn FROM projects) p
              JOIN (VALUES (1,'2024-02-30'), (2,'2024-13-45'), (3,'marzo 2024'),
                           (4,'2024-03-05'), (5,NULL),
                           (6,'05/03/2024'), (7,'3 Jan 2024')) v(rn, val) ON v.rn = p.rn;"
          uv run alembic upgrade head
          # Only the one real date survives; every impossible or free-text value
          # is NULL, which the report prints as N/A. Rows 6 and 7 are why the
          # ISO-SHAPE guard is load-bearing and not redundant with the validity
          # one: PostgreSQL accepts `05/03/2024` and reads it as 3 May, so a
          # Spanish 5 March would become a WRONG date in an institutional
          # report instead of N/A.
          test "$(psql "$PGURL" -tAc 'SELECT count(*) FROM systems WHERE installed_at IS NOT NULL;')" = "1"
          test "$(psql "$PGURL" -tAc 'SELECT installed_at FROM systems WHERE installed_at IS NOT NULL;')" = "2024-03-05"
          psql "$PGURL" -v ON_ERROR_STOP=1 -c "DELETE FROM projects WHERE name LIKE 'ci-%';"
        working-directory: backend
        env:
          DIOPTRA_ENV: test
          DIOPTRA_JWT_SECRET: ci-only-secret-value-at-least-32-chars
          DIOPTRA_DATABASE_URL: postgresql+psycopg://dioptra:ci-only-password@localhost:5432/dioptra
          PGURL: postgresql://dioptra:ci-only-password@localhost:5432/dioptra

      - name: The third-party backfill meets vendored SCA and SAST rows
        # 0013 compared `category <> 'sca'`, but the column stores the member
        # NAME (`SCA`): the SCA exemption never applied, and the unit test
        # pinned the same wrong literal because the suite runs on SQLite with
        # no real backfill (phase-11 panel, 2026-09-28). Prove both paths on
        # PostgreSQL: a fresh 0013, and 0016 correcting the old wrong result.
        run: |
          set -euo pipefail
          uv run alembic downgrade 0012_mutation_measured
          psql "$PGURL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO projects (id, name, created_at, updated_at)
              VALUES ('00000000-0000-4000-8000-0000000000c1', 'ci-tp', now(), now());
            INSERT INTO analyses (id, project_id, source_kind, source_ref, status,
                                  languages, frameworks, lockfiles, created_at)
              VALUES ('00000000-0000-4000-8000-0000000000c2', '00000000-0000-4000-8000-0000000000c1',
                      'ZIP', 'ci', 'DONE', '[]', '[]', '[]', now());
            INSERT INTO findings (id, analysis_id, ordinal, category, tools, rule_id, title,
                                  severity, path, \"references\", fingerprint)
              SELECT gen_random_uuid(), '00000000-0000-4000-8000-0000000000c2', v.o, v.c,
                     '[]', 'ci', 'ci', 'HIGH', v.p, '[]', 'ci-' || v.o
              FROM (VALUES (0, 'SCA', 'vendor/acme/composer.lock'),
                           (1, 'SAST', 'vendor/acme/Runner.php'),
                           (2, 'SAST', 'app/Own.php')) v(o, c, p);"
          marked() { psql "$PGURL" -tAc "SELECT string_agg(third_party::text, ',' ORDER BY ordinal) FROM findings WHERE rule_id = 'ci';"; }
          uv run alembic upgrade 0015_analysis_progress
          test "$(marked)" = "false,true,false"
          # The state the old 0013 left behind, then the correction.
          psql "$PGURL" -v ON_ERROR_STOP=1 -c "UPDATE findings SET third_party = true WHERE rule_id = 'ci' AND path LIKE 'vendor/%';"
          uv run alembic upgrade head
          test "$(marked)" = "false,true,false"
          psql "$PGURL" -v ON_ERROR_STOP=1 -c "DELETE FROM projects WHERE name = 'ci-tp';"
        working-directory: backend
        env:
          DIOPTRA_ENV: test
          DIOPTRA_JWT_SECRET: ci-only-secret-value-at-least-32-chars
          DIOPTRA_DATABASE_URL: postgresql+psycopg://dioptra:ci-only-password@localhost:5432/dioptra
          PGURL: postgresql://dioptra:ci-only-password@localhost:5432/dioptra

      - name: A cancelled analysis fits its column, and the downgrade keeps it
        # The status column stores the member NAME, and `CANCELLED` is nine
        # characters: under 0016 the column is VARCHAR(8), which PostgreSQL
        # enforces and the SQLite suite does not (phase 12, survey §2.2).
        # The negative control proves the widening is what makes it fit.
        run: |
          set -euo pipefail
          uv run alembic downgrade 0016_sca_third_party_correction
          psql "$PGURL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO projects (id, name, created_at, updated_at)
              VALUES ('00000000-0000-4000-8000-0000000000d1', 'ci-cancel', now(), now());"
          row() { psql "$PGURL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO analyses (id, project_id, source_kind, source_ref, status,
                                  languages, frameworks, lockfiles, created_at)
              VALUES ('00000000-0000-4000-8000-0000000000d2', '00000000-0000-4000-8000-0000000000d1',
                      'ZIP', 'ci', 'CANCELLED', '[]', '[]', '[]', now());"; }
          if row 2>/dev/null; then echo "CANCELLED fit a VARCHAR(8)?"; exit 1; fi
          uv run alembic upgrade head
          row
          state() { psql "$PGURL" -tAc "SELECT status || '|' || coalesce(failure_code, '') FROM analyses WHERE source_ref = 'ci' AND project_id = '00000000-0000-4000-8000-0000000000d1';"; }
          test "$(state)" = "CANCELLED|"
          uv run alembic downgrade 0016_sca_third_party_correction
          test "$(state)" = "FAILED|analysis_cancelled"
          uv run alembic upgrade head
          psql "$PGURL" -v ON_ERROR_STOP=1 -c "DELETE FROM projects WHERE name = 'ci-cancel';"
        working-directory: backend
        env:
          DIOPTRA_ENV: test
          DIOPTRA_JWT_SECRET: ci-only-secret-value-at-least-32-chars
          DIOPTRA_DATABASE_URL: postgresql+psycopg://dioptra:ci-only-password@localhost:5432/dioptra
          PGURL: postgresql://dioptra:ci-only-password@localhost:5432/dioptra

      - name: The audit trail is append-only in the real database
        # The suite runs on SQLite, which cannot exercise the plpgsql trigger.
        # Creating it is not the same as proving it enforces, so assert here that
        # UPDATE, DELETE and TRUNCATE are all refused (ASVS V7.1).
        run: |
          set -euo pipefail
          psql "$PGURL" -c "INSERT INTO audit_log (id, occurred_at, actor_username, action, outcome) VALUES (gen_random_uuid(), now(), 'ci', 'ci.probe', 'OK');"
          for stmt in "UPDATE audit_log SET action='tampered'" "DELETE FROM audit_log" "TRUNCATE audit_log"; do
            if psql "$PGURL" -v ON_ERROR_STOP=1 -c "$stmt"; then
              echo "::error::audit_log accepted '$stmt' — the append-only guarantee is broken"
              exit 1
            fi
            echo "refused as expected: $stmt"
          done
          test "$(psql "$PGURL" -tAc 'SELECT count(*) FROM audit_log;')" = "1"
        env:
          PGURL: postgresql://dioptra:ci-only-password@localhost:5432/dioptra

      - name: The runtime role cannot defeat the append-only triggers
        # docker/initdb/01-runtime-role.sql is what Compose runs on first init;
        # apply it here and prove `dioptra_app` can write rows but not drop
        # the trigger that protects them (P5 day 20, threat model residual).
        run: |
          set -euo pipefail
          DIOPTRA_APP_DB_PASSWORD=ci-app-password POSTGRES_USER=dioptra POSTGRES_DB=dioptra \
            psql "$PGURL" -v ON_ERROR_STOP=1 -f docker/initdb/01-runtime-role.sql
          APPURL="postgresql://dioptra_app:ci-app-password@localhost:5432/dioptra"
          psql "$APPURL" -v ON_ERROR_STOP=1 -c "INSERT INTO audit_log (id, occurred_at, actor_username, action, outcome) VALUES (gen_random_uuid(), now(), 'app', 'ci.probe', 'OK');"
          for stmt in "DROP TRIGGER audit_log_append_only ON audit_log" "ALTER TABLE audit_log DISABLE TRIGGER ALL" "DROP TABLE audit_log"; do
            if psql "$APPURL" -v ON_ERROR_STOP=1 -c "$stmt"; then
              echo "::error::dioptra_app was allowed '$stmt' — the role split is broken"
              exit 1
            fi
            echo "refused as expected: $stmt"
          done
        env:
          PGURL: postgresql://dioptra:ci-only-password@localhost:5432/dioptra

  dependency-vulnerabilities:
    # BLOCKING. A known-vulnerable dependency is a security defect, not a
    # freshness nit, so this one fails the build. Kept out of the advisory job
    # below precisely so its failure cannot be mistaken for version drift.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: No known-vulnerable npm dependency
        # If this fails with no upstream fix available, the answer is a reviewed,
        # explicit allowlist entry — never deleting the step.
        run: npm audit --audit-level=high
        working-directory: frontend

  dependency-currency:
    # ADVISORY ONLY, on purpose. `npm outdated` trips on any newer minor version,
    # so making it blocking would train us to disable the gate — a net security
    # loss. Currency is reported; vulnerability is enforced above. Kept a separate
    # job so an air-gapped runner can drop it without touching the real gates.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.1"
      - name: Python dependencies are current
        # --dry-run --upgrade prints what a fresh resolution would change.
        run: uv lock --upgrade --dry-run || echo "::warning::python dependencies are behind"
        working-directory: backend
      - name: npm dependencies are current
        run: npm outdated || echo "::warning::npm dependencies are behind"
        working-directory: frontend
