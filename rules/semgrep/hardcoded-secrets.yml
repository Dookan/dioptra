rules:
  - id: hardcoded-secret-assignment
    message: Credential assigned from a string literal in source; move it to the environment or a secrets manager and rotate it.
    severity: ERROR
    languages: [javascript, typescript, python]
    metadata:
      cwe: "CWE-798"
      owasp: "A07:2021"
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $KEY = "$VALUE"
          - pattern: $OBJ.$KEY = "$VALUE"
          - pattern: '$KEY: "$VALUE"'
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)^(password|passwd|pwd|secret|api_?key|apikey|access_?token|auth_?token|private_?key|client_?secret|db_?pass(word)?|jwt_?secret)$
      # At least 8 characters and not an obvious placeholder.
      - metavariable-regex:
          metavariable: $VALUE
          regex: (?i)^(?!(\$\{.*\}|<.*>|changeme|change_me|x{3,}|\*+|your[-_ ].*|placeholder|redacted|example.*|dummy.*|test.*|process\.env.*)$).{8,}$
