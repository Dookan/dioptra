rules:
  - id: js-eval-injection
    message: Dynamic code evaluation (eval / new Function / string timers) executes attacker-controllable text; replace with explicit logic or a safe parser.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-95"
      owasp: "A03:2021"
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: eval($X)
          - pattern: new Function(...)
          - pattern: setTimeout("$CODE", ...)
          - pattern: setInterval("$CODE", ...)
          - pattern: setTimeout($X + $Y, ...)
      - pattern-not: eval("...")
  - id: python-eval-exec-injection
    message: eval()/exec() on non-literal input executes arbitrary code; use ast.literal_eval or explicit dispatch.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-94"
      owasp: "A03:2021"
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: eval($X)
          - pattern: exec($X)
      - pattern-not: eval("...")
      - pattern-not: exec("...")
  - id: php-dynamic-code-execution
    message: Dynamic code execution on a non-literal value runs arbitrary PHP; replace with explicit dispatch.
    severity: ERROR
    languages: [php]
    metadata:
      cwe: "CWE-94"
      owasp: "A03:2021"
      category: security
      confidence: HIGH
    pattern-either:
      - pattern: eval($CODE)
      - pattern: assert($CODE)
      - pattern: create_function(...)
      - pattern: preg_replace("/.../e", ...)
  - id: php-dynamic-include
    message: include/require with a non-literal path can execute an attacker-chosen file; use a fixed allowlist.
    severity: ERROR
    languages: [php]
    metadata:
      cwe: "CWE-98"
      owasp: "A03:2021"
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: include $PATH;
          - pattern: include_once $PATH;
          - pattern: require $PATH;
          - pattern: require_once $PATH;
      - metavariable-pattern:
          metavariable: $PATH
          patterns:
            - pattern-not: "\"...\""
            - pattern-not: "'...'"
            - pattern-not: __DIR__ . "..."
            - pattern-not: __DIR__ . '...'
