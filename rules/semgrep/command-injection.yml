rules:
  - id: js-child-process-shell-injection
    message: Shell command built from non-literal input; use execFile/spawn with an argument array and validate every argument.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021"
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $CP.exec($CMD, ...)
          - pattern: $CP.execSync($CMD, ...)
          - pattern: exec($CMD, ...)
          - pattern: execSync($CMD, ...)
      - metavariable-pattern:
          metavariable: $CMD
          pattern-either:
            - pattern: $A + $B
            - pattern: "`...${...}...`"
            - pattern: $REQ.$FIELD
  - id: python-subprocess-shell-injection
    message: subprocess with shell=True and a non-literal command; pass an argument list and drop shell=True.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021"
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: subprocess.$FUNC($CMD, ..., shell=True, ...)
          - pattern: os.system($CMD)
          - pattern: os.popen($CMD)
      - pattern-not: subprocess.$FUNC("...", ..., shell=True, ...)
      - pattern-not: os.system("...")
      - pattern-not: os.popen("...")
  - id: php-shell-command-injection
    message: Shell command built from a non-literal value; use escapeshellarg() on every argument, or avoid the shell entirely.
    severity: ERROR
    languages: [php]
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021"
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: exec($CMD, ...)
          - pattern: shell_exec($CMD, ...)
          - pattern: system($CMD, ...)
          - pattern: passthru($CMD, ...)
          - pattern: popen($CMD, ...)
          - pattern: proc_open($CMD, ...)
      - metavariable-pattern:
          metavariable: $CMD
          patterns:
            - pattern-not: "\"...\""
            - pattern-not: "'...'"
