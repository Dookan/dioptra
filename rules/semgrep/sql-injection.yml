rules:
  - id: js-sql-string-concat
    message: SQL query built by string concatenation or template literal; use parameterized queries.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $DB.query($SQL, ...)
          - pattern: $DB.execute($SQL, ...)
          - pattern: $DB.raw($SQL, ...)
          - pattern: $DB.$METHOD.query($SQL, ...)
      - metavariable-pattern:
          metavariable: $SQL
          pattern-either:
            - pattern: $A + $B
            - pattern: "`...${...}...`"
  - id: python-sql-string-format
    message: SQL query built with f-string, % or .format(); pass parameters separately to execute().
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $CUR.execute($SQL, ...)
          - pattern: $CUR.executemany($SQL, ...)
          - pattern: $CUR.raw($SQL, ...)
      - metavariable-pattern:
          metavariable: $SQL
          pattern-either:
            - pattern: f"..."
            - pattern: $A % $B
            - pattern: $A.format(...)
            - pattern: $A + $B
  - id: php-sql-string-concat
    message: SQL query built by concatenation or interpolation; use a prepared statement with bound parameters.
    severity: ERROR
    languages: [php]
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $DB->query($SQL, ...)
          - pattern: $DB->exec($SQL, ...)
          - pattern: $DB->prepare($SQL, ...)
          - pattern: mysqli_query(..., $SQL, ...)
          - pattern: pg_query(..., $SQL, ...)
      - metavariable-pattern:
          metavariable: $SQL
          patterns:
            - pattern-not: "\"...\""
            - pattern-not: "'...'"
  - id: laravel-raw-sql-non-literal
    message: Laravel raw SQL built from a variable; pass bindings instead (whereRaw('col = ?', [$value])).
    severity: ERROR
    languages: [php]
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: DB::raw($SQL, ...)
          - pattern: DB::select($SQL, ...)
          - pattern: DB::statement($SQL, ...)
          - pattern: $Q->whereRaw($SQL, ...)
          - pattern: $Q->selectRaw($SQL, ...)
          - pattern: $Q->orderByRaw($SQL, ...)
          - pattern: $Q->havingRaw($SQL, ...)
      - metavariable-pattern:
          metavariable: $SQL
          patterns:
            - pattern-not: "\"...\""
            - pattern-not: "'...'"
