[project]
name = "dioptra-backend"
version = "0.1.0"
description = "Dioptra — white-box analysis platform backend"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }

# Every dependency MUST carry a free license (CLAUDE.md → Hard Rules).
# The license is stated here and re-verified in CI by scripts/license_gate.py.
dependencies = [
    "fastapi",          # MIT      — HTTP framework
    "uvicorn[standard]", # BSD-3   — ASGI server
    "sqlalchemy",       # MIT      — ORM / core
    "alembic",          # MIT      — schema migrations
    "psycopg[binary]",  # LGPL-3.0 — PostgreSQL driver
    "pydantic",         # MIT      — request/response models
    "pydantic-settings", # MIT     — env-driven settings
    "argon2-cffi",      # MIT      — Argon2id password hashing (ASVS V2.4)
    "pyjwt",            # MIT      — JWT encode/decode
    # --- Phase 1: audit pipeline (tasks/phase1-survey.md §3) ---
    "python-multipart", # Apache-2.0 — multipart parsing for the ZIP upload endpoint
    "rq",               # BSD-2    — job queue for the analysis pipeline (worker service)
    "redis",            # MIT      — client library RQ uses to talk to Valkey
    "jinja2",           # BSD-3    — report templates (HTML + Markdown), autoescape on
    "weasyprint",       # BSD-3    — HTML → PDF for the institutional report
    "python-docx",      # MIT      — basic DOCX export of the report
    # --- Phase 3: E5 flow diagrams and test briefs from the AST (tasks/phase3-survey.md §7) ---
    # MIT — incremental parser bindings; one engine for every language wave.
    # <0.26: the 0.26.0 binding corrupts the heap (SIGSEGV) on ordinary
    # ~150-statement functions (proven 2026-09-22, precommit panel); the API
    # parses hostile source, so a crash is a one-request DoS. Re-probe
    # (tests/test_ast_python.py::test_large_functions_do_not_crash_the_process)
    # before lifting the pin.
    "tree-sitter<0.26",
    "tree-sitter-javascript", # MIT — JS grammar (wave 1)
    "tree-sitter-typescript", # MIT — TS/TSX grammars (wave 1)
    "tree-sitter-python",     # MIT — Python grammar (wave 1)
    # --- Phase 7a: language wave 2 (tasks/phase7-survey.md §3.1) ---
    # MIT — PHP grammar. Declares tree-sitter~=0.24, inside the pin above.
    # The pin's re-probe is per grammar, not global: the 0.26 heap corruption
    # was a core-binding fault, so tests/test_ast_php.py carries its own
    # large-function probe (test_large_functions_do_not_crash_the_process).
    "tree-sitter-php",
]

[dependency-groups]
dev = [
    "pytest",           # MIT
    "pytest-cov",       # MIT
    "httpx2",           # BSD-3 — ASGI transport required by starlette's TestClient
    "ruff",             # MIT
    "mypy",             # MIT
    "mutmut",           # BSD-3 — phase-close mutation pass on gate / brief / triage modules (CLAUDE.md → Tests); the same discipline the product applies at E7
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["."]
# Audited-code fixtures are parsed, never imported: their style is the point.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit — we audit others, we audit ourselves
    "ASYNC",    # async correctness
    "C4", "SIM", "RET", "ARG", "PTH", "N", "ANN",
]
ignore = [
    "ANN401",   # typing.Any is occasionally the honest annotation
    "N818",     # domain errors read as outcomes (AccountLocked); the base class is AppError
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN201", "ARG001"]  # asserts and fixture creds are the point
"alembic/**" = ["ANN", "ARG", "N"]                          # generated revision shape
"app/db/types.py" = ["ARG002"]                              # TypeDecorator fixes the signature

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = []
# tests/fixtures holds audited-code samples: parsed by tree-sitter, never imported.
exclude = ["alembic/versions/", "tests/fixtures/"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
markers = [
    # The E7 sandbox tests start real containers from `dioptra-sandbox:latest`.
    # They are skipped where Docker or the image is absent, and they are the
    # only tests in the suite that need either.
    "sandbox: needs Docker and the built sandbox image",
]

[tool.mutmut]
# Phase-close targets only (CLAUDE.md → Code Conventions → Tests): the gate,
# brief, triage and test-plan modules, run against their own test files. Run
# `uv run mutmut run` then `uv run mutmut results`; a survivor is either
# killed by a new test or recorded as equivalent in the phase's task file.
source_paths = ["app"]
also_copy = ["templates", "alembic", "alembic.ini", "rules"]
only_mutate = [
    "app/workflow/gates.py",
    "app/workflow/brief.py",
    "app/workflow/triage.py",
    "app/workflow/test_plan.py",
    "app/workflow/verify.py",
    # Added 2026-09-23: the E4 ranking decides what a developer can even
    # SEE to plan, and the phase-7a walk showed a cap that hid a whole
    # project's own code. A decision surface belongs under mutation.
    "app/workflow/risk.py",
    "app/sandbox/results.py",
    # P5 close: correlation, VEX and the audit read (CLAUDE.md → Tests).
    "app/inventory/correlation.py",
    "app/inventory/versions.py",
    "app/inventory/importers.py",
    "app/inventory/documents.py",
    "app/inventory/sync.py",
    "app/audit/router.py",
    # P7a close (PHP wave 2): the escaping boundary that turns audited text
    # into generated PHP, the E6 inspector's own rules, and the SARIF severity
    # decision. `ast/extract.py` is deliberately NOT here, following the
    # existing shape of this list: it mutates DECISION surfaces, not parsers.
    "app/workflow/scaffold/text.py",
    "app/workflow/scaffold/inspect.py",
    "app/analysis/normalizer.py",
]
pytest_add_cli_args_test_selection = [
    "tests/test_gates.py",
    "tests/test_brief.py",
    "tests/test_cases_api.py",
    "tests/test_triage.py",
    "tests/test_test_plan.py",
    "tests/test_verify.py",
    "tests/test_sandbox.py",
    "tests/test_tests_api.py",
    "tests/test_inventory_versions.py",
    "tests/test_inventory_import.py",
    "tests/test_inventory_api.py",
    "tests/test_inventory_documents.py",
    "tests/test_inventory_hardening.py",
    "tests/test_audit_api.py",
    "tests/test_scaffold.py",
    "tests/test_scaffold_php.py",
    "tests/test_normalizer.py",
]
