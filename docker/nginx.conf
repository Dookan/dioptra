# Static bundle + API reverse proxy on a single origin.
#
# Same origin is what lets the refresh cookie be SameSite=Strict and the CSP be
# `default-src 'self'` with nothing else allowed.
#
# This file is an nginx TEMPLATE: the image's entrypoint fills
# ${DIOPTRA_API_UPSTREAM} at start-up (envsubst touches only variables that are
# defined in the environment, so nginx's own $host, $uri… are left alone).
# Default `http://api:8000` — the API container on the same Compose network.
# When the API runs on ANOTHER host, set it to that host's LAN address, e.g.
# `http://10.0.0.20:8000` (docs/deployment/README.md). The browser still sees
# one origin: the split is invisible to it, so no CORS is ever needed.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The audited code we later render is hostile; these headers are the floor.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    server_tokens off;
    client_max_body_size 1m;

    # The ZIP ingest (phase 10, tasks/phase10-survey.md): the archive is the
    # RAW body, up to ${DIOPTRA_MAX_ZIP_MIB} MiB — the same number as the
    # API's DIOPTRA_MAX_ZIP_BYTES; backend/tests/test_upload_caps.py keeps the
    # two defaults equal, and an operator who raises one raises both
    # (docs/deployment/README.md). nginx bounds chunked bodies too, which a
    # Content-Length check cannot. Buffering is OFF: nginx would otherwise
    # write the whole GiB to its own disk before forwarding a byte, and the
    # API streams it to the workspaces volume itself, after authentication.
    # The timeouts are per read/send between two packets, not per request, so
    # a slow LAN is fine as long as it keeps moving; extraction is the
    # worker's, so the response comes as soon as the last byte is stored.
    location ~ ^/api/v1/projects/[^/]+/ingest$ {
        proxy_pass ${DIOPTRA_API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        client_max_body_size ${DIOPTRA_MAX_ZIP_MIB}m;
        proxy_request_buffering off;
        client_body_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 600s;
    }

    # The vulnerability-dump import: its own cap, DIOPTRA_VULNDB_MAX_DUMP_BYTES
    # in MiB plus 1 MiB for the multipart envelope. It used to share the 200m
    # below and was refused by nginx between 200 and 512 MiB (phase 10, §2.3).
    location = /api/v1/inventory/vulndb/import {
        proxy_pass ${DIOPTRA_API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        client_max_body_size ${DIOPTRA_VULNDB_MAX_DUMP_MIB}m;
        proxy_read_timeout 600s;
    }

    location /api/ {
        proxy_pass ${DIOPTRA_API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        # No route under this block takes an upload any more; the cap stays
        # where it was, for anything a future route sends before it gets its
        # own location.
        client_max_body_size 200m;
        proxy_read_timeout 600s;
    }

    # Hashed asset filenames: safe to cache hard.
    #
    # MUST NOT declare add_header here. nginx inherits add_header from the server
    # level ONLY when the current level declares none, so a single add_header in
    # this block silently strips nosniff, X-Frame-Options, Referrer-Policy and the
    # CSP from every bundled JS/CSS response. `expires` is a separate directive and
    # does not break that inheritance, so it already gives us max-age=31536000
    # (we forgo only `immutable`, which merely skips revalidation on a reload).
    location /assets/ {
        expires 1y;
    }

    # Single-page app: unknown paths render the shell, they are not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
