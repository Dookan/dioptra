# Dioptra — full stack, on premise, air-gap friendly.
#
#   cp .env.example .env && edit it, then:  docker compose -f docker/docker-compose.yml up --build
#
# Secrets come from .env (gitignored). No service reaches the public internet at
# runtime; images are the only thing pulled, and only at build time.

name: dioptra

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dioptra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-dioptra}
      # The runtime role's password (docker/initdb/01-runtime-role.sql).
      DIOPTRA_APP_DB_PASSWORD: ${DIOPTRA_APP_DB_PASSWORD:?DIOPTRA_APP_DB_PASSWORD is required}
    volumes:
      # PostgreSQL 18 images expect the mount one level up: the data directory
      # is a version-named subdirectory so pg_upgrade can work in place.
      - postgres-data:/var/lib/postgresql
      # First-init scripts: the owner/runtime role split (P5 day 20). They run
      # once, when the data volume is empty.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dioptra} -d ${POSTGRES_DB:-dioptra}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Valkey (BSD-3) instead of Redis, whose licence stopped being free.
  # Broker of the RQ queue the worker consumes.
  valkey:
    image: valkey/valkey:9-alpine
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    environment:
      DIOPTRA_ENV: ${DIOPTRA_ENV:-prod}
      # The runtime role only (P5 day 20): the owner's URL never enters the
      # serving process — the one-shot `migrate` service below holds it.
      DIOPTRA_DATABASE_URL: postgresql+psycopg://dioptra_app:${DIOPTRA_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-dioptra}
      DIOPTRA_JWT_SECRET: ${DIOPTRA_JWT_SECRET:?DIOPTRA_JWT_SECRET is required (32+ characters)}
      DIOPTRA_REFRESH_COOKIE_SECURE: ${DIOPTRA_REFRESH_COOKIE_SECURE:-true}
      DIOPTRA_SEED_PASSWORD_AMEDINA: ${DIOPTRA_SEED_PASSWORD_AMEDINA:-}
      DIOPTRA_SEED_PASSWORD_MMARIN: ${DIOPTRA_SEED_PASSWORD_MMARIN:-}
      DIOPTRA_SEED_PASSWORD_CPEREZ: ${DIOPTRA_SEED_PASSWORD_CPEREZ:-}
      DIOPTRA_REDIS_URL: redis://valkey:6379/0
      DIOPTRA_WORKSPACE_ROOT: /var/lib/dioptra/workspaces
      DIOPTRA_VULNDB_SPOOL_DIR: /var/lib/dioptra/vulndb
      DIOPTRA_VULNDB_SYNC_ENABLED: ${DIOPTRA_VULNDB_SYNC_ENABLED:-true}
      # WeasyPrint's font cache must land on the tmpfs: the root is read-only.
      XDG_CACHE_HOME: /tmp
    volumes:
      # The API extracts uploads into the jail; the worker reads them. The API
      # NEVER gets the Docker socket — only the worker starts containers.
      - ${DIOPTRA_DATA_DIR:-/var/lib/dioptra}/workspaces:/var/lib/dioptra/workspaces
      # A vulnerability dump uploaded through the panel waits here for the
      # worker's import job; the API only spools it (P5, tasks/phase5-survey.md §2).
      - ${DIOPTRA_DATA_DIR:-/var/lib/dioptra}/vulndb:/var/lib/dioptra/vulndb
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # One-shot: applies the migrations as the schema OWNER and exits. It is the
  # only container that ever holds the owner's URL (P5 day 20): the API and
  # the worker connect as `dioptra_app`, which cannot alter the schema.
  migrate:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    environment:
      DIOPTRA_ENV: ${DIOPTRA_ENV:-prod}
      DIOPTRA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dioptra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dioptra}
      DIOPTRA_JWT_SECRET: ${DIOPTRA_JWT_SECRET:?DIOPTRA_JWT_SECRET is required (32+ characters)}
      DIOPTRA_REFRESH_COOKIE_SECURE: ${DIOPTRA_REFRESH_COOKIE_SECURE:-true}
      XDG_CACHE_HOME: /tmp
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # Runs the analysis pipeline: one ephemeral `dioptra-analysis` container per
  # tool, each with --network none and hard CPU/RAM/pids limits (tasks/
  # phase1-survey.md §3). It is the only service that can reach the Docker
  # daemon, which is why it is a separate process from the API.
  worker:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    environment:
      DIOPTRA_ENV: ${DIOPTRA_ENV:-prod}
      # The runtime role only: the worker never migrates.
      DIOPTRA_DATABASE_URL: postgresql+psycopg://dioptra_app:${DIOPTRA_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-dioptra}
      DIOPTRA_JWT_SECRET: ${DIOPTRA_JWT_SECRET:?DIOPTRA_JWT_SECRET is required (32+ characters)}
      DIOPTRA_REDIS_URL: redis://valkey:6379/0
      DIOPTRA_WORKSPACE_ROOT: /var/lib/dioptra/workspaces
      DIOPTRA_RUNNER_MODE: docker
      DIOPTRA_ANALYSIS_IMAGE: dioptra-analysis:latest
      DIOPTRA_RULES_DIR: /srv/app/rules
      DIOPTRA_OSV_DB_DIR: /var/lib/dioptra/osv
      DIOPTRA_SANDBOX_IMAGE: dioptra-sandbox:latest
      DIOPTRA_SANDBOX_IMAGE_PHP: dioptra-sandbox-php:latest
      DIOPTRA_SANDBOX_RUNS_ROOT: /var/lib/dioptra/runs
      # The vulnerability mirror (P5). The sync job is the ONLY outbound
      # connection of the whole stack, and it runs here, on the worker's
      # schedule; set the flag to false on an air-gapped host and import the
      # dump through the panel instead. Both endpoints are HTTPS-only settings.
      DIOPTRA_VULNDB_SYNC_ENABLED: ${DIOPTRA_VULNDB_SYNC_ENABLED:-true}
      DIOPTRA_VULNDB_SYNC_INTERVAL_HOURS: ${DIOPTRA_VULNDB_SYNC_INTERVAL_HOURS:-24}
      DIOPTRA_VULNDB_SPOOL_DIR: /var/lib/dioptra/vulndb
      XDG_CACHE_HOME: /tmp
    volumes:
      # Bind mounts handed to `docker run` are resolved by the HOST daemon, so
      # the jail, the rules copy and the OSV database must exist on the host at
      # the SAME path the worker sees. DIOPTRA_DATA_DIR is that directory
      # (owned by uid 10001); a named volume would be invisible to the sibling
      # container. The default keeps host path == container path.
      - ${DIOPTRA_DATA_DIR:-/var/lib/dioptra}/workspaces:/var/lib/dioptra/workspaces
      - ${DIOPTRA_DATA_DIR:-/var/lib/dioptra}/osv:/var/lib/dioptra/osv:ro
      # E7 attempt directories. Host path == container path, like the jail,
      # because the sibling container's mount is resolved by the HOST daemon —
      # which is also why this CANNOT be the sized tmpfs the P4 survey §2
      # described: a tmpfs declared here exists only inside the worker and the
      # sandbox container would never see it. The size bound is therefore an
      # OPERATOR step on the host, and it is not optional: the sandbox mounts
      # one of these read-write, so a test that writes forever would otherwise
      # fill the host disk, PostgreSQL included. Mount it as its own sized
      # filesystem before starting the stack, e.g.
      #   mount -t tmpfs -o size=512m,uid=10001,gid=10001,mode=0770 \
      #         tmpfs ${DIOPTRA_DATA_DIR:-/var/lib/dioptra}/runs
      # (or give the directory its own volume / XFS project quota).
      - type: bind
        source: ${DIOPTRA_DATA_DIR:-/var/lib/dioptra}/runs
        target: /var/lib/dioptra/runs
      - ${DIOPTRA_DATA_DIR:-/var/lib/dioptra}/vulndb:/var/lib/dioptra/vulndb
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      analysis-image:
        condition: service_completed_successfully
      sandbox-image:
        condition: service_completed_successfully
      sandbox-php-image:
        condition: service_completed_successfully
    # JSON payloads and a job class that refuses every callable but the
    # pipeline: a write to Valkey must not become code execution in the one
    # process that holds the Docker socket (threat model → Accepted residuals).
    # `--with-scheduler`: RQ's own scheduler runs the vulnerability sync at
    # its interval (the job re-enqueues itself under a fixed id). No extra
    # dependency, no cron container.
    command:
      [
        "rq", "worker", "--url", "redis://valkey:6379/0",
        "--serializer", "json", "--job-class", "app.core.queue.PipelineJob",
        "--with-scheduler",
        "analysis",
      ]
    # The worker runs as uid 10001; the socket belongs to the host's docker
    # group. Its GID differs per host: `stat -c %g /var/run/docker.sock`.
    group_add:
      - "${DIOPTRA_DOCKER_GID:-999}"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Build-only service: produces the `dioptra-analysis` image the worker spawns.
  # It never runs; `docker compose build analysis-image` is enough on its own.
  analysis-image:
    build:
      context: ..
      dockerfile: docker/analysis.Dockerfile
    image: dioptra-analysis:latest
    command: ["true"]
    restart: "no"

  # Build-only, like analysis-image: the E7 sandbox the worker starts one
  # container from per verification attempt. It ships the test runners and the
  # mutation tools preinstalled, and installs NOTHING of the audited project.
  sandbox-image:
    build:
      context: ..
      dockerfile: docker/sandbox.Dockerfile
    image: dioptra-sandbox:latest
    command: ["true"]
    restart: "no"

  # ONE IMAGE PER LANGUAGE (tasks/phase7-survey.md §7.1): PHP brings its own
  # runtime, PHPUnit, Infection and Xdebug, which would roughly double the
  # wave-1 image for every deployment — including the ones that audit no PHP.
  # A deployment that never audits PHP can skip building this one; the worker
  # then refuses a PHP verification with SandboxUnavailable, which is closed,
  # not silent.
  sandbox-php-image:
    build:
      context: ..
      dockerfile: docker/sandbox-php.Dockerfile
    image: dioptra-sandbox-php:latest
    command: ["true"]
    restart: "no"

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "${DIOPTRA_HTTP_PORT:-8080}:8080"
    depends_on:
      - api
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres-data:
  valkey-data:
